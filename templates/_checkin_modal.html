{# ==================== 打卡 / 编辑弹窗（共用） ====================
   依赖上下文：dog、plan、stool_scores、commands、triggers、today
   用法：新打卡 → onclick="openCheckin(this)"   编辑 → onclick="openEdit(this)" data-event='...'
#}
<div class="modal fade" id="ckModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title" id="ckTitle">记录</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="ckDog" value="{{ dog.id }}">
        <input type="hidden" id="ckEditId">
        <input type="hidden" id="ckType">
        <input type="hidden" id="ckTime">
        <input type="hidden" id="ckDay">
        <input type="hidden" id="ckKey">
        <div class="row g-2 align-items-end mb-3">
          <div class="col-6">
            <label class="form-label">日期</label>
            <input type="date" class="form-control form-control-sm" id="ckDayInput" value="{{ today }}">
          </div>
          <div class="col-6">
            <label class="form-label">时间</label>
            <input type="time" class="form-control form-control-sm" id="ckTimeInput">
          </div>
        </div>

        <!-- 喂食 -->
        <div data-sec="feed" class="d-none">
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label">投喂量（g）</label>
              <input type="number" step="1" class="form-control form-control-sm" id="feed_amount" placeholder="{{ plan.per_meal_g }}">
            </div>
            <div class="col-6">
              <label class="form-label">实际吃完（g）</label>
              <input type="number" step="1" class="form-control form-control-sm" id="feed_eaten" placeholder="吃完填同上的数">
            </div>
            <div class="col-12">
              <label class="form-label">主食（品牌 / 类型）</label>
              <input type="text" class="form-control form-control-sm" id="feed_food" placeholder="皇家幼犬粮 / 干粮">
            </div>
            <div class="col-6">
              <label class="form-label">零食</label>
              <input type="text" class="form-control form-control-sm" id="feed_snack" placeholder="鸡肉条 2 条">
            </div>
            <div class="col-6">
              <label class="form-label">补充剂</label>
              <input type="text" class="form-control form-control-sm" id="feed_supplement" placeholder="益生菌 1 包">
            </div>
          </div>
        </div>

        <!-- 排泄 -->
        <div data-sec="potty" class="d-none">
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label">类型</label>
              <select class="form-select form-select-sm" id="potty_kind">
                <option value="便">便便</option>
                <option value="尿">尿</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">地点</label>
              <input type="text" class="form-control form-control-sm" id="potty_loc" placeholder="阳台尿垫 / 楼下草坪">
            </div>
            <div class="col-12">
              <label class="form-label">便便评分（1-7，尿不用填）</label>
              <select class="form-select form-select-sm" id="potty_score">
                {% for s, form, judge, lv in stool_scores %}
                <option value="{{ s }}">{{ s }} 分 — {{ form }}{{ '（' + judge + '）' if lv != 'ok' }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-12">
              <label class="form-label">触发点</label>
              <select class="form-select form-select-sm" id="potty_trigger">
                <option value="">—</option>
                {% for a, b in triggers %}<option value="{{ a }}">{{ a }}（{{ b }}）</option>{% endfor %}
              </select>
            </div>
            <div class="col-12 d-flex gap-4">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="potty_success" checked>
                <label class="form-check-label" for="potty_success">在定点完成</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="potty_blood">
                <label class="form-check-label text-danger" for="potty_blood">便中带血 / 粘液</label>
              </div>
            </div>
          </div>
        </div>

        <!-- 训练 -->
        <div data-sec="train" class="d-none">
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label">训练项目</label>
              <select class="form-select form-select-sm" id="train_command">
                {% for c in commands %}<option value="{{ c.name }}">{{ c.order }}. {{ c.name }}</option>{% endfor %}
                <option value="社会化练习">社会化练习</option>
                <option value="定点排便练习">定点排便练习</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="col-4">
              <label class="form-label">时长(分钟)</label>
              <input type="number" class="form-control form-control-sm" id="train_minutes" value="5">
            </div>
            <div class="col-4">
              <label class="form-label">成功次数</label>
              <input type="number" class="form-control form-control-sm" id="train_success" value="4">
            </div>
            <div class="col-4">
              <label class="form-label">总次数</label>
              <input type="number" class="form-control form-control-sm" id="train_total" value="5">
            </div>
            <div class="col-6">
              <label class="form-label">环境</label>
              <select class="form-select form-select-sm" id="train_env">
                <option>室内</option><option>院子</option><option>安静街道</option><option>公园</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">干扰等级 1-5</label>
              <select class="form-select form-select-sm" id="train_distract">
                <option value="1">1 无干扰</option><option value="2">2 轻微</option>
                <option value="3" selected>3 一般</option><option value="4">4 较强</option>
                <option value="5">5 强干扰</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">奖励物</label>
              <input type="text" class="form-control form-control-sm" id="train_reward" placeholder="鸡肉粒 / 玩具球">
            </div>
            <div class="col-6">
              <label class="form-label">下次调整</label>
              <input type="text" class="form-control form-control-sm" id="train_adjust" placeholder="明天加到 8 秒">
            </div>
          </div>
        </div>

        <!-- 体重 -->
        <div data-sec="weight" class="d-none">
          <label class="form-label">体重（kg）</label>
          <input type="number" step="0.1" class="form-control" id="weight_kg" placeholder="5.2">
        </div>

        <!-- 饮水 -->
        <div data-sec="water" class="d-none">
          <label class="form-label">饮水量（ml，估算）</label>
          <input type="number" class="form-control" id="water_ml" placeholder="250">
        </div>

        <!-- 备注（所有类型通用） -->
        <div class="mt-3">
          <label class="form-label">备注</label>
          <input type="text" class="form-control form-control-sm" id="ckNote" placeholder="选填">
        </div>

        <div id="ckEditHint" class="d-none small text-muted mt-2">✏️ 正在修改已有记录，保存后原记录被覆盖。</div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">取消</button>
        <button type="button" class="btn btn-brand btn-sm" id="ckSaveBtn" onclick="submitCheckin()">保存记录</button>
      </div>
    </div>
  </div>
</div>
